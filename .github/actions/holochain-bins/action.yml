name: Holochain binaries
description: >
  Installs Holochain's official prebuilt Linux binaries (holochain, hc,
  lair-keystore, kitsune2-bootstrap-srv) from the pinned release, each
  checked against its SHA-256 -- a changed or tampered download fails the
  build. Bump the version and hashes together.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE: holochain-0.7.1
      run: |
        set -euo pipefail
        bin="$HOME/.local/holochain/bin"
        mkdir -p "$bin"
        cd "$bin"
        while read -r sha asset name; do
          gh release download "$RELEASE" -R holochain/holochain -p "$asset" -O "$name" --clobber
          echo "$sha  $name" | sha256sum --check --strict
          chmod +x "$name"
        done <<'PINNED'
        0c14700874349c8417c4bfebfe845e7ab036757442e4388e50dd622bb3c89974 holochain-x86_64-unknown-linux-gnu holochain
        56eb7de100a77a1883fd606a30b33bc2c17bd5b3bd32935304d4f6e34cbff718 hc-x86_64-unknown-linux-gnu hc
        87c7a02556d47d950f0d4284bfdb4e37737b0bc98afe038955817793606d669a lair-keystore-x86_64-unknown-linux-gnu lair-keystore
        f080b3ee4f3d4e37a2d790eb3df9722b5b1a1924d9d6c730c05c64859273a9d5 kitsune2-bootstrap-srv-x86_64-unknown-linux-gnu kitsune2-bootstrap-srv
        PINNED
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/holochain" --version
