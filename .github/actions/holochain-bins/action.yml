name: Holochain binaries
description: >
  Installs Holochain's official prebuilt Linux binaries (holochain, hc,
  lair-keystore, kitsune2-bootstrap-srv) from the pinned release, each
  checked against its SHA-256 -- a changed or tampered download fails the
  build. Bump the version and hashes together.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE: holochain-0.7.0
      run: |
        set -euo pipefail
        bin="$HOME/.local/holochain/bin"
        mkdir -p "$bin"
        cd "$bin"
        while read -r sha asset name; do
          gh release download "$RELEASE" -R holochain/holochain -p "$asset" -O "$name" --clobber
          echo "$sha  $name" | sha256sum --check --strict
          chmod +x "$name"
        done <<'PINNED'
        ffa40a0c6fab5ce062c4af76328dfe2de143256ddf791a504d72bca698a9ba20 holochain-x86_64-unknown-linux-gnu holochain
        f1eca56b97bc2261324e00e0e86a274f7dc8363f73264e697fd0c0216b2aac23 hc-x86_64-unknown-linux-gnu hc
        7a77822ab5e0020d0f3c358030d4ccfa8c6c144407a5c075d302c7b0fcf670c1 lair-keystore-x86_64-unknown-linux-gnu lair-keystore
        ba5a61c981300c1854e33cec5a091bfb2f9137ea977a938685eef0afa809b7be kitsune2-bootstrap-srv-x86_64-unknown-linux-gnu kitsune2-bootstrap-srv
        PINNED
        echo "$bin" >> "$GITHUB_PATH"
        "$bin/holochain" --version
