[package]
name = "dispatch_coordinator"
edition.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
name = "dispatch"

[dependencies]
hdk.workspace = true
hdi.workspace = true
serde.workspace = true
relay_types.workspace = true
relay_coordinator_support.workspace = true
dispatch_integrity = { path = "../integrity" }
dispute_types.workspace = true
attestation_types.workspace = true
relay_integrity_support.workspace = true
sha2 = { version = "0.10", default-features = false }
catalog_types.workspace = true
relay_governance.workspace = true
# Time zones, for recurring orders ("9:00 every day" in the customer's zone).
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
chrono-tz = { version = "0.10", default-features = false }

[features]
# Raw link externs for validation tests; only ever hot-swapped into test
# conductors, never packed into the hApp (see raw_link_test_externs!).
test-utils = []

[dev-dependencies]
serde_json = "1"
