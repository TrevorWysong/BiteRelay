[workspace]
resolver = "2"
members = [
    "dnas/relay/types",
    "dnas/relay/coordinator_support",
    "dnas/relay/governance",
    "dnas/relay/integrity_support",
    "dnas/relay/zomes/profiles/integrity",
    "dnas/relay/zomes/profiles/coordinator",
    "dnas/relay/zomes/catalog/types",
    "dnas/relay/zomes/catalog/integrity",
    "dnas/relay/zomes/catalog/coordinator",
    "dnas/relay/zomes/dispatch/types",
    "dnas/relay/zomes/dispatch/integrity",
    "dnas/relay/zomes/dispatch/coordinator",
    "dnas/relay/zomes/attestation/types",
    "dnas/relay/zomes/attestation/integrity",
    "dnas/relay/zomes/attestation/coordinator",
    "dnas/relay/zomes/ledger/types",
    "dnas/relay/zomes/ledger/integrity",
    "dnas/relay/zomes/ledger/coordinator",
    "dnas/relay/zomes/reputation/integrity",
    "dnas/relay/zomes/reputation/coordinator",
    "dnas/relay/zomes/account/types",
    "dnas/relay/zomes/account/integrity",
    "dnas/relay/zomes/account/coordinator",
]

[workspace.package]
edition = "2021"
version = "0.1.0"

# Holochain 0.7.1's HDK and HDI, pinned exactly: the integrity zomes' build
# decides the DNA hash, so a patch bump is a new network. Bump them together
# with the conductor (.github/actions/holochain-bins, `holochain --version`)
# and the JS client -- hdk and hdi don't share version numbers (hdk 0.7.1
# depends on hdi =0.8.1).
[workspace.dependencies]
hdi = "=0.8.1"
hdk = "=0.7.1"
serde = { version = "1", features = ["derive"] }
holochain_serialized_bytes = "0.0.57"
relay_types = { path = "dnas/relay/types" }
relay_coordinator_support = { path = "dnas/relay/coordinator_support" }
attestation_types = { path = "dnas/relay/zomes/attestation/types" }
relay_governance = { path = "dnas/relay/governance" }
relay_integrity_support = { path = "dnas/relay/integrity_support" }
dispatch_types = { path = "dnas/relay/zomes/dispatch/types" }
catalog_types = { path = "dnas/relay/zomes/catalog/types" }
ledger_types = { path = "dnas/relay/zomes/ledger/types" }
account_types = { path = "dnas/relay/zomes/account/types" }

[profile.release]
opt-level = "z"
lto = true
# Arithmetic that overflows fails (and so does the validation or call doing
# it) instead of wrapping silently. Amounts are bounded so it shouldn't
# happen (`integrity_support::limits::MAX_AMOUNT`); this keeps any slip safe.
overflow-checks = true
